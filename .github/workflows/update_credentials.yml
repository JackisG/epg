name: Update IPTV Credentials

on:
  schedule:
    # Run daily at 3:00 UTC (approx 5:00 AM in Lithuania)
    - cron: '0 3 * * *'
  workflow_dispatch:  # allow manual trigger for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          TWO_CAPTCHA_API_KEY: ${{ secrets.TWO_CAPTCHA_API_KEY }}
        run: python update_credentials.py

      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/lit.m3u
          git commit -m "chore: update IPTV credentials" || echo "No changes to commit"
          git push