name: Update IPTV Credentials

on:
  schedule:
    # Runs at 5:00 AM Vilnius time (Adjust UTC offset based on DST)
    # EEST (UTC+3) -> 2 AM UTC. EST (UTC+2) -> 3 AM UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass Vilnius time check for manual testing?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  update-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run credential updater
        env:
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
          # IMPORTANT: The default GITHUB_TOKEN cannot update repository secrets.
          # You must create a Personal Access Token (PAT) with 'repo' scope 
          # and save it as a secret named PAT_TOKEN in your repository settings.
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }} 
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: python update_credentials.py