name: Update IPTV Credentials

on:
  schedule:
    # Run at 02:00 and 03:00 UTC; the script will only proceed at 5:00 Vilnius time
    - cron: '0 2,3 * * *'
  workflow_dispatch:   # allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new credentials and update lit.m3u
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: python update_credentials.py

      - name: Commit and push changes
        if: success()
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add languages/lit.m3u
          git diff --staged --quiet || (git commit -m "Update IPTV credentials" && git push)