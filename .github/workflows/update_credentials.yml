name: Update IPTV Credentials

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python, pip, and xvfb
        run: |
          apt-get update
          apt-get install -y python3 python3-pip xvfb
          python3 --version
          pip3 --version

      - name: Install dependencies
        run: |
          pip3 install cloakbrowser PyGithub requests

      - name: Run credential updater with xvfb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTICAPTCHA_API_KEY: ${{ secrets.ANTICAPTCHA_API_KEY }}
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: |
          xvfb-run -a python3 update_credentials.py