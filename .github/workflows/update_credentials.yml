name: Update IPTV Credentials

on:
  schedule:
    - cron: '2 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python and pip
        run: |
          apt-get update
          apt-get install -y python3 python3-pip git
          python3 --version
          pip3 --version

      - name: Install base dependencies
        run: |
          pip3 install playwright PyGithub

      - name: Clone cloudflare-solver (latest)
        run: |
          git clone https://github.com/art3m4ik3/cloudflare-solver.git

      - name: Install solver dependencies and pre-download Camoufox addons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cloudflare-solver
          if [ -f requirements.txt ]; then
            pip3 install -r requirements.txt
          else
            pip3 install camoufox colorama playwright-stealth
          fi
          # Pre-download Camoufox addons to avoid API rate limits later
          camoufox install

      - name: Install Playwright browser
        run: |
          python3 -m playwright install chromium

      - name: Run credential updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update_credentials.py
