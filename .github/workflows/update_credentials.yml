name: Update IPTV Credentials

on:
  schedule:
    # 5:00 AM Europe/Vilnius corresponds to 03:00 UTC (during EEST daylight saving time) or 02:00 UTC (during EET standard time)
    # Cron schedule is in UTC. Setting to '0 3 * * *' runs at 03:00 UTC (5:00 AM Lithuanian Summer Time EEST).
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run credentials update script
        env:
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
        run: python update_credentials.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/lit.m3u lit.m3u 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV credentials" && git push)
