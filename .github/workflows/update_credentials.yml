name: Update IPTV Credentials

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run updater
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: python update_credentials.py

      - name: Upload debug artifact (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page
          path: debug_page.html

      - name: Commit and push if changed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/lit.m3u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update freeiptv credentials ($(date +%Y-%m-%d))"
            git push
          fi