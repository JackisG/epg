name: Update IPTV Credentials

on:
  schedule:
    - cron: '2 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy

    env:
      HOME: /root
      CAMOUFOX_HEADLESS: 1   # force headless mode for Camoufox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python, pip, and xvfb
        run: |
          apt-get update
          apt-get install -y python3 python3-pip git xvfb
          python3 --version
          pip3 --version

      - name: Install base dependencies
        run: |
          pip3 install playwright PyGithub

      - name: Clone cloudflare-solver (latest)
        run: |
          git clone https://github.com/art3m4ik3/cloudflare-solver.git

      - name: Install solver dependencies & pre‑download Camoufox addons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cloudflare-solver
          if [ -f requirements.txt ]; then
            pip3 install -r requirements.txt
          else
            pip3 install camoufox colorama playwright-stealth
          fi
          # Pre‑download addons
          python3 -c "from camoufox.pkgman import CamoufoxFetcher; CamoufoxFetcher().install()"

      - name: Install Playwright browsers (Chromium + Firefox)
        run: |
          python3 -m playwright install chromium firefox

      - name: Run credential updater (with virtual X server)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAMOUFOX_HEADLESS: 1
          HOME: /root
        run: |
          xvfb-run -a python3 update_credentials.py
