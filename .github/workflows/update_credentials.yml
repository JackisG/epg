name: Update IPTV Credentials

on:
  schedule:
    # Runs at 02:00 UTC every day (which is 05:00 AM in Lithuania during Summer Time / EEST)
    # If winter time comes (EET / UTC+2), change '0 2' to '0 3'
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update_credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Oxylabs Scraper and Update M3U
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: python update_credentials.py

      - name: Upload debug HTML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-output
          path: debug_output.html
          retention-days: 7

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n "$(git status --porcelain)" ]]; then
            git add languages/lit.m3u
            git commit -m "Automated daily update of IPTV credentials"
            git push
          else
            echo "No changes to commit. Credentials might be the same or update failed."
          fi