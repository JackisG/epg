name: Update IPTV Credentials

on:
  schedule:
    - cron: '2 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libgbm1 libasound2 libxcomposite1 libxdamage1 \
            libxrandr2 libpango-1.0-0 libcairo2 libcups2 \
            libdbus-1-3 libx11-xcb1 libxcb1 libxcb-shm0 \
            libxcb-xfixes0

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          # No need for 'scrapling install' – we already have playwright browsers

      - name: Run credential updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_credentials.py
