name: Update IPTV Credentials

on:
  schedule:
    - cron: '2 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy   # kept for dependencies

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python and pip
        run: |
          apt-get update
          apt-get install -y python3 python3-pip
          python3 --version
          pip3 --version

      - name: Install dependencies
        run: |
          pip3 install -r requirements.txt
          # Install browsers for rebrowser-playwright
          python3 -m playwright install chromium

      - name: Run credential updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PLAYWRIGHT_BROWSERS_PATH – let it use the default ~/.cache/ms-playwright
        run: python3 update_credentials.py
