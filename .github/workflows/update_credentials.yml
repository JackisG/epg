name: Auto Update IPTV Credentials

on:
  schedule:
    # Runs every 23 hours to ensure credentials are refreshed before the 24h expiration
    - cron: '0 */23 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run Scraper Script
        id: scraper
        run: python update_credentials.py

      - name: Commit and Push credentials.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add credentials.json
          git commit -m "chore: auto-update IPTV credentials [skip ci]" || echo "No changes to commit"
          git push