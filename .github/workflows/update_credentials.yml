name: Update IPTV Credentials

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update_credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Install Playwright browsers (with dependencies)
          python -m playwright install --with-deps

      - name: Run Playwright scraper and update M3U
        env:
          # Optional: set these secrets if you want Oxylabs fallback (not required for Playwright)
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: |
          set -o pipefail
          python credentials.py 2>&1 | tee credentials.log

      - name: Show produced debug files
        if: always()
        run: |
          echo "Workspace files:"
          ls -la
          echo "Debug artifact preview (if exists):"
          if [ -f debug_output.html ]; then
            echo "----- debug_output.html (first 200 lines) -----"
            head -n 200 debug_output.html || true
          else
            echo "(no debug_output.html)"
          fi
          if [ -f credentials.log ]; then
            echo "----- credentials.log (last 200 lines) -----"
            tail -n 200 credentials.log || true
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credentials-debug
          path: |
            debug_output.html
            credentials.log
          retention-days: 7

      - name: Commit & push updated M3U
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add languages/lit.m3u
            git commit -m "Automated update: freeiptv credentials"
            git push
          else
            echo "No changes to commit."
          fi