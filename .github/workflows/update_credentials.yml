name: Update IPTV Credentials

on:
  schedule:
    - cron: '0 3 * * *'   # ~5–6 AM Lithuanian time
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python and pip
        run: |
          apt-get update
          apt-get install -y python3 python3-pip
          python3 --version
          pip3 --version

      - name: Install dependencies
        run: |
          pip3 install rebrowser-playwright PyGithub
          python3 -m rebrowser_playwright install chromium

      - name: Run credential updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 update_credentials.py