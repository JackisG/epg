name: Update IPTV Credentials

on:
  schedule:
    # Runs at 02:00 UTC every day (≈05:00 Lithuania during EEST)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update_credentials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Oxylabs Realtime scraper and update M3U
        env:
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: |
          set -o pipefail
          python update_credentials.py 2>&1 | tee update_credentials.log

      - name: Show debug files (for convenience)
        if: always()
        run: |
          echo "Workspace files:"
          ls -la
          echo ""
          echo "Debug file (if exists):"
          if [ -f debug_output.html ]; then
            echo "------ debug_output.html (first 200 lines) ------"
            head -n 200 debug_output.html || true
            echo "------ end preview ------"
          else
            echo "(no debug_output.html present)"
          fi
          echo ""
          echo "update_credentials.log (last 200 lines):"
          if [ -f update_credentials.log ]; then
            tail -n 200 update_credentials.log || true
          else
            echo "(no update_credentials.log present)"
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-credentials-debug
          path: |
            debug_output.html
            update_credentials.log
          retention-days: 7

      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add languages/lit.m3u
            git commit -m "Automated daily update of IPTV credentials"
            git push
          else
            echo "No changes to commit. Credentials might be the same or update failed."
          fi