name: Update IPTV Credentials

on:
  schedule:
    # 3:00 UTC → ~5:00 AM LT (winter) or 6:00 AM LT (summer)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python and pip
        run: |
          apt-get update
          apt-get install -y python3 python3-pip
          python3 --version
          pip3 --version

      - name: Install dependencies
        run: |
          pip3 install playwright PyGithub requests
          python3 -m playwright install chromium

      - name: Run credential updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTICAPTCHA_API_KEY: ${{ secrets.ANTICAPTCHA_API_KEY }}
        run: python3 update_credentials.py