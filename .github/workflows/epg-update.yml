name: Grab EPG

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run grab
        run: |
          npm run grab --- \
            --sites=cgates.lt \
            --output=guide.xml \
            --gzip=guide.xml.gz \
            --maxConnections=5

      - name: Commit and push guide.xml.gz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f guide.xml.gz ]; then
            echo "ERROR: guide.xml.gz was not created"
            ls -la
            exit 1
          fi

          git add -f guide.xml.gz
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update guide.xml.gz $(date -u +%Y-%m-%d)"
            git push
          fi
