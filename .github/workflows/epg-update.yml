name: Grab EPG

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:   # Allows manual runs from the Actions tab

permissions:
  contents: write      # Required to commit back to the repo

jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run grab
        run: |
          npm run grab --- --sites=cgates.lt --output=guide.xml --gzip --maxConnections=5

      - name: Commit and push guide.xml.gz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f guide.xml.gz ]; then
            git add guide.xml.gz

            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Update guide.xml.gz $(date -u +%Y-%m-%d)"
              git push
            fi
          else
            echo "guide.xml.gz not found – grab may have failed"
            exit 1
          fi
